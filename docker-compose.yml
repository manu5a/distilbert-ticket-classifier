# Local stack: PostgreSQL + the API.
#   docker compose up --build
# API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tickets:tickets@db:5432/tickets
      MODEL_VERSION: local-docker
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Use the model you trained locally without rebuilding the image.
      - ./models:/app/models:ro

volumes:
  pgdata:
