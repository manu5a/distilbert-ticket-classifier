name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      # A real PostgreSQL so the API tests run against the same database as production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tickets:tickets@localhost:5432/tickets_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=app --cov=ml --cov-report=term-missing

  docker:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ticket-classifier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and check /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db ticket-classifier:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
